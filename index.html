<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ENTP</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      box-sizing: border-box;
      background: #F6F4EF;
      color: #1F2933;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.5;
    }

    main {
      width: 100%;
      max-width: 460px;
      padding: 40px 36px;
      box-sizing: border-box;
      background: #FFFFFF;
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 24px rgba(16, 24, 40, 0.06);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.75rem;
    }

    .intro {
      margin: 0 0 24px;
      color: #667085;
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    a {
      display: block;
      padding: 16px 18px;
      color: #1F2933;
      text-decoration: none;
      border: 1px solid #D0D5DD;
      border-radius: 8px;
      transition: border-color 0.15s ease;
    }

    a:hover {
      border-color: #243B53;
    }

    a:focus-visible {
      outline: 3px solid #243B53;
      outline-offset: 3px;
    }

    .project-name {
      display: block;
      font-weight: 600;
      color: #243B53;
    }

    .project-description {
      display: block;
      margin-top: 2px;
      font-size: 0.925rem;
      color: #667085;
    }
  </style>
</head>
<body>
  <main>
    <h1>ENTP</h1>
    <p class="intro">Class projects.</p>
    <ul>
      <li>
        <a href="GradeNeededCalculator/index.html">
          <span class="project-name">What Grade Do I Need?</span>
          <span class="project-description">Find the score you need on a remaining exam or assignment to reach your target course grade.</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
